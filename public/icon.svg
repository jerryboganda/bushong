<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Trefoil / Radiation & Atom orbits -->
  <g transform="translate(256, 210)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="150" ry="52" fill="none" stroke="url(#ringGrad)" stroke-width="6" transform="rotate(30)" stroke-opacity="0.85" />
    <ellipse cx="0" cy="0" rx="150" ry="52" fill="none" stroke="url(#ringGrad)" stroke-width="6" transform="rotate(-30)" stroke-opacity="0.85" />
    <ellipse cx="0" cy="0" rx="150" ry="52" fill="none" stroke="url(#ringGrad)" stroke-width="6" transform="rotate(90)" stroke-opacity="0.85" />
    
    <!-- Central Nucleus glow -->
    <circle cx="0" cy="0" r="28" fill="#38bdf8" filter="url(#glow)" opacity="0.6" />
    <circle cx="0" cy="0" r="22" fill="#ffffff" />
    
    <!-- Quantum electron dots -->
    <circle cx="-110" cy="-60" r="9" fill="#38bdf8" />
    <circle cx="120" cy="-45" r="9" fill="#818cf8" />
    <circle cx="0" cy="140" r="9" fill="#06b6d4" />
  </g>

  <!-- Open Book Symbol at Bottom -->
  <g transform="translate(256, 360)">
    <!-- Left Page -->
    <path d="M -120 40 C -70 20 -20 30 0 45 L 0 -45 C -20 -60 -70 -70 -120 -50 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Right Page -->
    <path d="M 120 40 C 70 20 20 30 0 45 L 0 -45 C 20 -60 70 -70 120 -50 Z" fill="#e2e8f0" />
    <!-- Page lines -->
    <line x1="-95" y1="-25" x2="-25" y2="-12" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="-95" y1="-5" x2="-25" y2="8" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="-95" y1="15" x2="-25" y2="28" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

    <line x1="25" y1="-12" x2="95" y2="-25" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="8" x2="95" y2="-5" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="28" x2="95" y2="15" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />

    <!-- Center spine bookmark in gold -->
    <path d="M -8 -45 L 8 -45 L 6 30 L 0 22 L -6 30 Z" fill="url(#gold)" />
  </g>

  <!-- Star of life / medical cross accent -->
  <g transform="translate(256, 75)">
    <rect x="-6" y="-20" width="12" height="40" rx="3" fill="url(#gold)" />
    <rect x="-20" y="-6" width="40" height="12" rx="3" fill="url(#gold)" />
  </g>
</svg>
